<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to my Portfolio | ASTRA | About Me</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              hyper: '#f97316',
              accent: {
                50: '#fff7ed',
                100: '#ffedd5',
                500: '#f97316',
                600: '#ea580c',
                700: '#c2410c',
              }
            },
            letterSpacing: {
              'super-tighter': '-0.06em',
              'super-wide': '0.4em',
            },
            lineHeight: {
              'tight-ish': '1.05',
            },
            animation: {
              shimmer: 'shimmer 2s infinite linear',
              'float': 'float 6s ease-in-out infinite',
              'gradient-x': 'gradient-x 3s ease infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'gradient-x': {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root { 
        scroll-padding-top: 100px;
      }
      body {
        cursor: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      ::selection { background: #f97316; color: white; }
      
      *, *::before, *::after {
        transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                    border-color 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                    color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #cursor-dot { transition: transform 0.05s linear !important; }
      #cursor-outline { transition: transform 0.15s cubic-bezier(0.17, 0.67, 0.83, 0.67), width 0.3s ease, height 0.3s ease !important; }

      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .dark .glass-card {
        background: rgba(15, 23, 42, 0.25);
        box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .text-balance { text-wrap: balance; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #f97316;
        border-radius: 10px;
      }

      #cursor-dot {
        pointer-events: none;
        position: fixed;
        width: 6px;
        height: 6px;
        background: #f97316;
        border-radius: 50%;
        z-index: 9999;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%);
      }
      #cursor-outline {
        pointer-events: none;
        position: fixed;
        width: 32px;
        height: 32px;
        border: 1px solid rgba(249, 115, 22, 0.5);
        border-radius: 50%;
        z-index: 9998;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%);
      }
      .cursor-hover #cursor-outline {
        width: 64px;
        height: 64px;
        background: rgba(249, 115, 22, 0.1);
        border-color: #f97316;
        border-width: 2px;
      }

      .grain-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.03;
        z-index: 100;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
    "@tsparticles/engine": "https://esm.sh/@tsparticles/engine@3.5.0",
    "@tsparticles/slim": "https://esm.sh/@tsparticles/slim@3.5.0",
    "tsparticles": "https://esm.sh/tsparticles@3.5.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#fafafa] text-slate-900 dark:bg-[#050505] dark:text-slate-100 antialiased overflow-x-hidden font-sans">
    <div class="grain-overlay"></div>
    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
